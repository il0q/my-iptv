<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Master</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#07090d;--panel:#0f131a;--panel2:#151b24;--line:#242c38;--text:#f5f7fa;--muted:#8f9aaa;--accent:#31d39a;--danger:#ff5f6d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% 0%,#123329 0,transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(7,9,13,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{max-width:1500px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--accent)}.count{color:var(--muted);font-size:12px;margin-left:auto}
.wrap{max-width:1500px;margin:auto;padding:22px 20px 50px}
.hero{padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 20px 60px #0005}
h1{margin:0 0 8px;font-size:clamp(32px,5vw,58px);letter-spacing:-2px}.sub{color:var(--muted);font-size:14px}
.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,button,select{font:inherit}
input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input{flex:1;min-width:220px}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 15px;cursor:pointer}button:hover{background:var(--panel2)}button.active{background:var(--accent);color:#04140e;border-color:var(--accent);font-weight:800}
.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,.8fr);gap:16px}
.card{background:rgba(15,19,26,.9);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.player{aspect-ratio:16/9;background:#000;position:relative}video{width:100%;height:100%;display:block;background:#000}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}
.now{padding:14px 16px;border-top:1px solid var(--line)}.now b{display:block}.now small{color:var(--muted)}
.status{padding:0 16px 14px;color:var(--muted);font-size:12px;line-height:1.6}.error{color:var(--danger)}
.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list{height:560px;overflow:auto;padding:8px}
.channel{width:100%;display:flex;align-items:center;gap:10px;text-align:right;margin:3px 0;padding:10px;border-radius:12px;background:transparent;border:1px solid transparent}
.channel:hover,.channel.active{background:rgba(49,211,154,.08);border-color:#31d39a44}
.logo{width:40px;height:40px;object-fit:contain;border-radius:9px;background:#090b10;border:1px solid var(--line);flex:none}
.cn{min-width:0}.cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cn small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.list{height:420px}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">IPTV <span>MASTER</span></div><div class="count" id="count"></div></div></header>
<main class="wrap">
<section class="hero"><h1>جميع القنوات</h1><div class="sub">تم تحميل القنوات من الملف المرفوع، مع بحث وتصنيفات ومشغل مباشر.</div></section>
<div class="controls">
<input id="search" placeholder="ابحث عن قناة...">
<select id="group"><option value="">كل التصنيفات</option></select>
<button id="all" class="active">الكل</button><button id="fav">المفضلة ★</button>
</div>
<section class="layout">
<div class="card">
<div class="player"><video id="video" controls playsinline></video><div class="empty" id="empty">اختر قناة من القائمة لبدء التشغيل</div></div>
<div class="now"><b id="now">لا توجد قناة</b><small id="meta">—</small></div>
<div class="status" id="status">جاهز</div>
</div>
<div class="card"><div class="head"><b>القنوات</b><span id="shown"></span></div><div class="list" id="list"></div></div>
</section>
</main>

let hls=null, current=null, favorites=JSON.parse(localStorage.getItem("iptv-favs")||"[]");
const $=id=>document.getElementById(id);
$("count").textContent=CHANNELS.length.toLocaleString("ar")+" قناة";
$("shown").textContent=CHANNELS.length.toLocaleString("ar");
const groups=[...new Set(CHANNELS.map(c=>c.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
for(const g of groups){const o=document.createElement("option");o.value=g;o.textContent=g;$("group").appendChild(o)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setStatus(t,error=false){$("status").textContent=t;$("status").className="status"+(error?" error":"")}
function filtered(){const q=$("search").value.trim().toLowerCase(),g=$("group").value,fav=$("fav").classList.contains("active");return CHANNELS.filter(c=>(!q||c.name.toLowerCase().includes(q)||(c.group||"").toLowerCase().includes(q))&&(!g||c.group===g)&&(!fav||favorites.includes(c.url)))}
function render(){const arr=filtered();$("shown").textContent=arr.length.toLocaleString("ar");$("list").innerHTML=arr.map((c,i)=>`<button class="channel ${current&&current.url===c.url?"active":""}" data-i="${i}"><img class="logo" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'"><span class="cn"><b>${esc(c.name)}</b><small>${esc(c.group||c.country||"")}</small></span></button>`).join("");[...$("list").children].forEach((el,i)=>el.onclick=()=>play(arr[i],el))}
function play(c,el){current=c;document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("empty").style.display="none";$("now").textContent=c.name;$("meta").textContent=c.group||c.country||"بث مباشر";setStatus("جاري الاتصال...");if(hls){try{hls.destroy()}catch(e){}hls=null}const v=$("video");v.pause();v.removeAttribute("src");v.load();if(/^http:\/\//i.test(c.url)&&location.protocol==="https:"){setStatus("المتصفح يمنع HTTP داخل HTTPS.",true);return}if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(c.url));hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus("البث جاهز ✓");v.play().catch(()=>setStatus("اضغط تشغيل داخل الفيديو"))});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)setStatus("تعذر تشغيل المصدر: "+(d.details||"خطأ في الشبكة أو صلاحية المصدر"),true)});hls.attachMedia(v)}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=c.url;v.onloadedmetadata=()=>v.play().catch(()=>{});v.onerror=()=>setStatus("تعذر تشغيل المصدر في المتصفح.",true);v.load()}else setStatus("المتصفح لا يدعم HLS.",true)}
$("search").oninput=render;$("group").onchange=render;$("all").onclick=()=>{$("fav").classList.remove("active");$("all").classList.add("active");render()};$("fav").onclick=()=>{$("fav").classList.toggle("active");$("all").classList.toggle("active");render()};render();
